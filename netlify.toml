[build]
  base = ""
  command = "npm install && cd backend && npm install && npm run build && cd ../frontend && npm install && npm run build && cd .. && mkdir -p netlify-functions/api && cp -r backend/dist/* netlify-functions/api/ && mv netlify-functions/api/lambda.js netlify-functions/api/index.js"
  publish = "frontend/dist"
  functions = "netlify-functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["bcrypt"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
