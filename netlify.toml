[build]
  base = ""
  command = "cd backend && npm install && npm run build && cd ../frontend && npm install && npm run build && cd .. && mkdir -p netlify-functions && cp backend/dist/lambda.js netlify-functions/"
  publish = "frontend/dist"
  functions = "netlify-functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@nestjs/microservices", "@nestjs/websockets", "cache-manager", "class-transformer", "class-validator"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/lambda/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
